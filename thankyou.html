<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Thank You | J. POCA BOOKS</title>
<meta name="description" content="Thank you from J. POCA Books.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Besley:wght@600;700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: only light;
    --ivory:#F5EBDD; --card:#FBF4E9; --walnut:#5A3E2B; --walnut-deep:#46301F;
    --honey:#C98F4E; --sand:#EAD9BF; --ink:#3C2A1C; --soft:#5c4632; --muted:#8a7258;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:#F5EBDD; color:var(--ink); font-family:'Karla', Helvetica, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  .ty-card { background:var(--card); border:1px solid var(--sand); border-radius:16px; padding:48px 32px; text-align:center; max-width:480px; width:100%; box-shadow:0 10px 30px rgba(90,62,43,.14); }
  .quill { width:34px; height:34px; margin:0 auto 20px; display:block; }
  .ty-label { font-size:11px; letter-spacing:4px; text-transform:uppercase; color:var(--honey); font-weight:600; margin-bottom:10px; }
  .ty-title { font-family:'Marcellus', serif; font-weight:400; font-size:clamp(28px, 7vw, 40px); line-height:1.15; color:var(--ink); margin-bottom:16px; }
  .ty-text { font-size:15px; line-height:1.75; color:var(--soft); margin-bottom:30px; }
  .btn { display:inline-block; background:var(--honey); color:var(--ink); font-family:'Karla', sans-serif; font-weight:600; font-size:12.5px; letter-spacing:2.5px; text-transform:uppercase; padding:14px 36px; border:none; border-bottom:3px solid var(--walnut); border-radius:0; text-decoration:none; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
  .btn:hover, .btn:focus { transform:translateY(-2px); box-shadow:0 6px 16px rgba(90,62,43,.3); }
  .wordmark { font-family:'Marcellus', serif; color:var(--muted); font-size:13px; letter-spacing:3px; margin-top:28px; }
</style>
</head>
<body>
  <div class="ty-card">
    <svg class="quill" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 3.5c-5.5.5-10 3-12.5 6.5-1.8 2.5-2.6 5.4-2.9 8.2l-1.6 2.3c-.2.3.2.7.5.5l2.3-1.6c2.8-.3 5.7-1.1 8.2-2.9 3.5-2.5 6-7 6.5-12.5.05-.3-.2-.55-.5-.5zM8 16c2-4.5 5.5-7.5 9.5-9-1.5 4-4.5 7.5-9 9.5l-.5-.5z" fill="#C98F4E"/></svg>
    <div class="ty-label">Got It</div>
    <h1 class="ty-title">Thank You</h1>
    <p class="ty-text">Your message came through and landed with me directly. I read every one, and I'll get back to you as soon as I can.</p>
    <a class="btn" href="/">Back To The Books</a>
    <div class="wordmark">J. POCA BOOKS</div>
  </div>
</body>
</html>
